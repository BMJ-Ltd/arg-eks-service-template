apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{SERVICE_NAME}}
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/load-balancer-name: k8s-{{SERVICE_NAME}}
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/CERT_ID  # Set in ingress-vars.yaml
    alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/inbound-cidrs: 10.0.0.0/8  # Set in ingress-vars.yaml to restrict access
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-port: "traffic-port"
    alb.ingress.kubernetes.io/healthcheck-path: {{HEALTHCHECK_PATH}}  # e.g., /actuator/health or /
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "20"
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=3600,load_balancing.algorithm.type=least_outstanding_requests
    alb.ingress.kubernetes.io/tags: app={{SERVICE_NAME}}
    alb.ingress.kubernetes.io/group.name: {{SERVICE_NAME}}
    alb.ingress.kubernetes.io/certificate-arn: 
    alb.ingress.kubernetes.io/inbound-cidrs: 
  labels:
    app: {{SERVICE_NAME}}
spec:
  ingressClassName: alb
