apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: "REPLACE_WITH_SERVICE_NAME"
      app: "REPLACE_WITH_SERVICE_NAME"
      team: "REPLACE_WITH_TEAM_NAME"
      costcentre: "REPLACE_WITH_PRODUCT_NAME"
      project: "REPLACE_WITH_SERVICE_NAME"
      product: "REPLACE_WITH_PRODUCT_NAME"
      app.kubernetes.io/managed-by: kustomize

resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - ingress.yaml
  # Optional resources (uncomment as needed):
  # - pvc.yaml
  # - instrumentation.yaml  # Enable for OpenTelemetry tracing (also uncomment annotation in deployment.yaml)
  # - argocd.yaml
