- op: add
  path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
  value: ACTUAL_CERTIFICATE_ARN_HERE  # Replace with: arn:aws:acm:eu-west-1:{ACCOUNT}:certificate/{ID}

- op: add
  path: /metadata/annotations/alb.ingress.kubernetes.io~1ssl-policy
  value: ELBSecurityPolicy-TLS13-1-2-2021-06

- op: add
  path: /metadata/annotations/alb.ingress.kubernetes.io~1inbound-cidrs
  value: 172.26.0.0/16  # Replace with actual VPC CIDR or allowed ranges

- op: add
  path: /spec/rules/0/host
  value: {{SERVICE_NAME}}.{{PRODUCT}}.dev.eks.bmjgroup.com  # Replace {{PRODUCT}} with your product namespace
